name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    # branches: ['main']
    branches: ['nobranch']
    paths-ignore: ['docs/**']

  push:
    branches: ['main']
    # branches: ['nobranch']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache local backend
        uses: docker/bake-action@v6
        with:
          push: false
          load: true
          files: docker-compose.local.yml
          targets: django
          set: |
            django.cache-from=type=gha,scope=django-cached-tests
            django.cache-to=type=gha,scope=django-cached-tests,mode=max
            postgres.cache-from=type=gha,scope=postgres-cached-tests
            postgres.cache-to=type=gha,scope=postgres-cached-tests,mode=max

      - name: Build and cache docs
        uses: docker/bake-action@v6
        with:
          push: false
          load: true
          files: docker-compose.docs.yml
          set: |
            docs.cache-from=type=gha,scope=cached-docs
            docs.cache-to=type=gha,scope=cached-docs,mode=max

      - name: Check DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py migrate

      - name: Run Django Tests
        run: docker compose -f docker-compose.local.yml run django pytest

      - name: Tear down the Stack
        run: docker compose -f docker-compose.local.yml down

  # ==========================================
  # CD Deployment Job Optimized for Whitenoise & Offline Compression
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    # needs: [linter, pytest] # Run ONLY if formatting and tests pass successfully
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Execute only on direct pushes/merges to main

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to your project directory (adjust if cloned elsewhere)
            cd /home/ubuntu/mmhci

            # 2. Sync the repository with the latest main branch
            git pull origin main

            # 3. Pull newest base images and build your custom production images
            sudo docker compose -f production.yml build

            # 4. Compile static assets and execute manifest compilation inside the container image
            # Required by your settings: COMPRESS_OFFLINE = True
            sudo docker compose -f production.yml run --rm django python manage.py collectstatic --noinput
            sudo docker compose -f production.yml run --rm django python manage.py compress

            # 5. Bring down old stack safely and launch updated containers in background
            sudo docker compose -f production.yml down --remove-orphans
            sudo docker compose -f production.yml up -d

            # 6. Apply database schema migrations seamlessly
            sudo docker compose -f production.yml run --rm django python manage.py migrate
