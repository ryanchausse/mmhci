{% load static %}
<script nonce="{{ csp_nonce }}" type="text/javascript">
  const statusBadge = (cell) => {
    const value = cell.getValue();
    const map = { Active: 'success', Invited: 'info', Suspended: 'secondary' };
    const color = map[value] || 'secondary';
    return `<span class="badge text-bg-${color}">${value}</span>`;
  };
  document.addEventListener('DOMContentLoaded', () => {
    {% if organisation_group_memberships %}
      let data = []
      {% for organisation_group_membership in organisation_group_memberships %}
        data.push({
          link: "{% url 'core:organisation_group_memberships:view' pk=organisation_group_membership.pk %}",
          user: "{{ organisation_group_membership.user|escapejs|safe }}",
          organisation_group: "{{ organisation_group_membership.organisation_group|escapejs|safe }}",
          description: "{{ organisation_group_membership.description|escapejs|safe }}",
          added: "{{ organisation_group_membership.created_at }}"
        });
      {% endfor %}
      const table = new Tabulator('#organisation-group-memberships-table', {
        data: data,
        layout: 'fitDataStretch',
        pagination: true,
        paginationSize: 10,
        paginationSizeSelector: [10, 25, 50, 100, 100],
        movableColumns: true,
        columnDefaults: {
          minWidth: 150,
        },
        columns: [
          {
            title: 'Actions',
            field: 'link',
            formatter: function(cell) {
                var url = cell.getValue();
                return `<a href="${url}" class="btn btn-primary">View</a>`;
            },
            headerSort: false
          },
          { title: 'User', field: 'user', headerFilter: 'input' },
          { title: 'Organisation Group', field: 'organisation_group', headerFilter: 'input' },
          { title: 'Description', field: 'description', headerFilter: 'input' },
          { title: 'Added', field: 'added', sorter: 'date' },
        ],
      });
      document.getElementById('table-filter').addEventListener('input', (e) => {
        const value = e.target.value;
        if (value) {
          table.setFilter([
            [
              { field: 'user', type: 'like', value: value },
              { field: 'organisation_group', type: 'like', value: value },
              { field: 'description', type: 'like', value: value },
            ],
          ]);
        } else {
          table.clearFilter();
        }
      });
      document
        .getElementById('export-csv')
        .addEventListener('click', () => table.download('csv', 'memberships.csv'));
      document
        .getElementById('export-json')
        .addEventListener('click', () => table.download('json', 'memberships.json'));
      document
        .getElementById('print-table')
        .addEventListener('click', () => table.print(false, true));
    {% endif %}
  });
</script>
