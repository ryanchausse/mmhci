  function createSparklineChart(selector, data) {
    const options = {
      series: [{ data }],
      chart: {
        type: 'line',
        width: 150,
        height: 30,
        sparkline: {
          enabled: true,
        },
      },
      colors: ['var(--bs-primary)'],

        width: 2,
      },
      tooltip: {
        fixed: {
          enabled: false,
        },
        x: {
          show: false,
        },
        y: {
          title: {
            formatter() {
              return '';
            },
          },
        },
        marker: {
          show: false,
        },
      },
    };
    const chart = new ApexCharts(document.querySelector(selector), options);
