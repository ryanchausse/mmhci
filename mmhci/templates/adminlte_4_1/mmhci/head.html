{% load static %}
{% load django_htmx %}
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>MMHCI</title>
  <!-- Favicons -->
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicons/cropped-nwmphn-favicon-1-180x180.png' %}">
  <!--begin::Theme Init (prevents flash of incorrect theme on load, #6043)-->
  <script nonce="{{ csp_nonce }}">
    (() => {
      'use strict';
      const STORAGE_KEY = 'lte-theme';
      let stored = null;
      try {
        stored = localStorage.getItem(STORAGE_KEY);
      } catch {
        // localStorage may be unavailable (private mode, sandboxed iframe).
      }
      const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
      // Mirror the resolution in _scripts.astro: explicit "dark"/"light" win,
      // otherwise ("auto" or unset) fall back to the OS preference.
      let resolved = 'light';
      if (stored === 'dark' || stored === 'light') {
        resolved = stored;
      } else if (prefersDark) {
        resolved = 'dark';
      }
      document.documentElement.setAttribute('data-bs-theme', resolved);
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
  {% htmx_script %}
  <!--end::Theme Init-->
  <!--begin::Accessibility Meta Tags-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
  <!--end::Accessibility Meta Tags-->
  <!--begin::Primary Meta Tags-->
  <meta name="title" content="MMHCI" />
  <meta name="author" content="ColorlibHQ" />
  <meta
    name="description"
    content="MMHCI Main App"
  />
  <meta
    name="keywords"
    content="MMHCI"
  />
  <!--end::Primary Meta Tags-->
  <!--begin::Accessibility Features-->
  <!-- Skip links will be dynamically added by accessibility.js -->
  <meta name="supported-color-schemes" content="light dark" />
  <!--end::Accessibility Features-->
  <!--begin::Fonts-->
  <link
    rel="preload"
    as="style"
    href="{% static 'adminlte_4_1/mmhci/css/fontsource-sans-3.css' %}"
    integrity="sha256-V8QPXlSlh/xqbwZO8TuUL/G4UhK2V1gJiSSGQCTDdWs="
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="{% static 'adminlte_4_1/mmhci/css/fontsource-sans-3.css' %}"
    integrity="sha256-V8QPXlSlh/xqbwZO8TuUL/G4UhK2V1gJiSSGQCTDdWs="
    crossorigin="anonymous"
    media="all"
  />

  <!--end::Fonts-->
  <!--begin::Third Party Plugin(OverlayScrollbars)-->
  <link
    nonce="{{ csp_nonce }}"
    rel="stylesheet"
    href="{% static 'adminlte_4_1/mmhci/css/overlayscrollbars.min.css' %}"
    crossorigin="anonymous"
  />
  <!--end::Third Party Plugin(OverlayScrollbars)-->
  <!--begin::Third Party Plugin(Bootstrap Icons)-->
  <link
    nonce="{{ csp_nonce }}"
    rel="stylesheet"
    href="{% static 'adminlte_4_1/mmhci/css/bootstrap-icons.min.css' %}"
    crossorigin="anonymous"
  />
  <!--end::Third Party Plugin(Bootstrap Icons)-->
  <!-- apexcharts (optional but included for all pages; minor cache hit)-->
  <link
    nonce="{{ csp_nonce }}"
    rel="stylesheet"
    href="{% static 'adminlte_4_1/mmhci/css/apexcharts.css' %}"
    integrity="sha256-4MX+61mt9NVvvuPjUWdUdyfZfxSB1/Rf9WtqRHgG5S0="
    crossorigin="anonymous"
  />
  <!-- tabulator bootstrap (optional but included for all pages; minor cache hit)-->
  <link
    nonce="{{ csp_nonce }}"
    rel="stylesheet"
    href="{% static 'adminlte_4_1/mmhci/css/tabulator_bootstrap5.min.css' %}"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="{% static 'adminlte_4_1/mmhci/css/custom_tabulator_styles.css' %}" />
  <!--begin::Required Plugin(AdminLTE)-->
  <link rel="stylesheet" href="{% static 'adminlte_4_1/css/adminlte.css' %}" />
  <!--end::Required Plugin(AdminLTE)-->
  <meta name="htmx-config" content='{"inlineStyleNonce": "{{ csp_nonce }}"}'>
</head>
