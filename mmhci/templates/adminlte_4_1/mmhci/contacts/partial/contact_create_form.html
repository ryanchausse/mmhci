{% load crispy_forms_tags %}
<form
  method="post"
  action="{% url 'core:contacts:create' %}"
  autocomplete="off">
  {% csrf_token %}
  <label for="{{ form.person.id_for_label }}">Person</label>
  <br />
  <input
    class="form-control w-25 mt-1"
    type="search"
    name="q"
    placeholder="Type to find a person..."
    autocomplete="off"
    hx-get="{% url 'core:people:search' %}"
    hx-trigger="input changed delay:300ms"
    hx-target="#{{ form.person.id_for_label }}"
    hx-swap="innerHTML"
    autofocus>

  <select
    id="{{ form.person.id_for_label }}"
    class="form-select mt-1"
    name="{{ form.person.html_name }}"
    required>
    <option value="" disabled>No matching people</option>
  </select>
  {{ form.person.errors }}
  <br />
  {{ form.type|as_crispy_field }}
  {{ form.description|as_crispy_field }}
  <button type="submit" name="contact_submit" class="btn btn-primary mt-3">Add Contact</button>
</form>
