{% load static %}
<script nonce="{{ csp_nonce }}" type="text/javascript">
  const statusBadge = (cell) => {
    const value = cell.getValue();
    const map = { Active: 'success', Invited: 'info', Suspended: 'secondary' };
    const color = map[value] || 'secondary';
    return `<span class="badge text-bg-${color}">${value}</span>`;
  };
  document.addEventListener('DOMContentLoaded', () => {
    {% comment %} document.getElementById('contacts-nav-link').classList.add('active'); {% endcomment %}
    {% if contacts %}
      let data = []
      {% for contact in contacts %}
        data.push({
          link: "{% url 'core:contacts:view' uuid=contact.uuid %}",
          person: "{{ contact.person|escapejs|safe }}",
          type: "{{ contact.email|escapejs|safe }}",
          description: "Contact",
          status: "Incomplete",
          added: "{{ contact.created_at }}"
        });
      {% endfor %}
      const table = new Tabulator('#contacts-table', {
        data: data,
        layout: 'fitDataStretch',
        pagination: true,
        paginationSize: 10,
        paginationSizeSelector: [10, 25, 50, 100, 100],
        movableColumns: true,
        columnDefaults: {
          minWidth: 150,
        },
        columns: [
          {
            title: 'Actions',
            field: 'link',
            formatter: function(cell) {
                var url = cell.getValue();
                return `<a href="${url}" class="btn btn-primary">View</a>`;
            },
            headerSort: false
          },
          { title: 'Person', field: 'person', headerFilter: 'input' },
          { title: 'Type', field: 'type', headerFilter: 'input' },
          {
            title: 'Description',
            field: 'description',
            headerFilter: 'input',
          },
          {
            title: 'Status',
            field: 'status',
            formatter: statusBadge,
            headerFilter: 'list',
            headerFilterParams: { values: ['', 'Incomplete', 'Complete', 'Referred'] },
            hozAlign: 'center',
          },
          { title: 'Added', field: 'added', sorter: 'date' },
        ],
      });
      document.getElementById('table-filter').addEventListener('input', (e) => {
        const value = e.target.value;
        if (value) {
          table.setFilter([
            [
              { field: 'person', type: 'like', value: value },
              { field: 'type', type: 'like', value: value },
              { field: 'description', type: 'like', value: value },
              { field: 'status', type: 'like', value: value },
            ],
          ]);
        } else {
          table.clearFilter();
        }
      });
      document
        .getElementById('export-csv')
        .addEventListener('click', () => table.download('csv', 'contacts.csv'));
      document
        .getElementById('export-json')
        .addEventListener('click', () => table.download('json', 'contacts.json'));
      document
        .getElementById('print-table')
        .addEventListener('click', () => table.print(false, true));
    {% endif %}
  });
</script>
