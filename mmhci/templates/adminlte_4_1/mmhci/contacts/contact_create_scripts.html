{% load static %}
<script nonce="{{ csp_nonce }}" type="text/javascript">
  document.addEventListener('DOMContentLoaded', () => {
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === '{{ form.person.id_for_label }}') {
            const selectEl = evt.detail.target;
            selectEl.size = Math.max(1, selectEl.options.length);
        }
    });
    document.body.addEventListener('click', function(evt) {
      if (evt.target.id === '{{ form.person.id_for_label }}') {
          evt.target.size = 1;
      }
    });
    document.body.addEventListener('change', function(evt) {
      if (evt.target.id === '{{ form.person.id_for_label }}') {
          evt.target.size = 1;
      }
    });
    document.body.addEventListener('blur', function(evt) {
      if (evt.target.id === '{{ form.person.id_for_label }}') {
          evt.target.size = 1;
      }
    });
  });
</script>
