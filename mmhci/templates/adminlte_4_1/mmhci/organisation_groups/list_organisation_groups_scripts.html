{% load static %}
<script nonce="{{ csp_nonce }}" type="text/javascript">
  const statusBadge = (cell) => {
    const value = cell.getValue();
    const map = { Active: 'success', Invited: 'info', Suspended: 'secondary' };
    const color = map[value] || 'secondary';
    return `<span class="badge text-bg-${color}">${value}</span>`;
  };
  document.addEventListener('DOMContentLoaded', () => {
    {% if organisation_groups %}
      let data = []
      {% for organisation_group in organisation_groups %}
        data.push({
          link: "{% url 'core:organisation_groups:view' pk=organisation_group.pk %}",
          name: "{{ organisation_group.name|escapejs|safe }}",
          organisation: "{{ organisation_group.organisation|escapejs|safe }}",
          roles: "{{ organisation_group.role_list|escapejs|safe }}",
          added: "{{ organisation_group.created_at }}"
        });
      {% endfor %}
      const table = new Tabulator('#organisation-groups-table', {
        data: data,
        layout: 'fitDataStretch',
        pagination: true,
        paginationSize: 10,
        paginationSizeSelector: [10, 25, 50, 100, 100],
        movableColumns: true,
        columnDefaults: {
          minWidth: 150,
        },
        columns: [
          {
            title: 'Actions',
            field: 'link',
            formatter: function(cell) {
                var url = cell.getValue();
                return `<a href="${url}" class="btn btn-primary">View</a>`;
            },
            headerSort: false
          },
          { title: 'Name', field: 'name', headerFilter: 'input' },
          { title: 'Organisation', field: 'organisation', headerFilter: 'input' },
          { title: 'Roles', field: 'roles', headerFilter: 'input' },
          { title: 'Added', field: 'added', sorter: 'date' },
        ],
      });
      document.getElementById('table-filter').addEventListener('input', (e) => {
        const value = e.target.value;
        if (value) {
          table.setFilter([
            [
              { field: 'name', type: 'like', value: value },
              { field: 'organisation', type: 'like', value: value },
              { field: 'roles', type: 'like', value: value },
            ],
          ]);
        } else {
          table.clearFilter();
        }
      });
      document
        .getElementById('export-csv')
        .addEventListener('click', () => table.download('csv', 'organisation_groups.csv'));
      document
        .getElementById('export-json')
        .addEventListener('click', () => table.download('json', 'organisation_groups.json'));
      document
        .getElementById('print-table')
        .addEventListener('click', () => table.print(false, true));
    {% endif %}
  });
</script>
