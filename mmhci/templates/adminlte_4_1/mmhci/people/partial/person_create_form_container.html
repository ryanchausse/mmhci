{% load crispy_forms_tags %}
<div id="person-create-form-container">
  <form
    method="post"
    action="{% url 'core:people:person_create' %}"
    hx-post="{% url 'core:people:person_create' %}"
    hx-target="#person-create-form-container"
    hx-swap="innerHTML">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary mt-3">Submit</button>
  </form>
</div>
