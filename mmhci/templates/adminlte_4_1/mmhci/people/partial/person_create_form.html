{% load crispy_forms_tags %}
<form
  method="post"
  action="{% url 'core:people:create' %}"
  autocomplete="off"
  hx-post="{% url 'core:people:create' %}"
  hx-target="#person-create-form-container"
  hx-swap="innerHTML">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary mt-3">Add Person</button>
</form>
