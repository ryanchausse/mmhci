{% load crispy_forms_tags %}
<div id="person-view-or-update-remaining-fields-container" hx-swap-oob="innerHTML">
  <div class="missing-fields-container">
    {% if uuid %}
      <!-- Omitted 'card' class due to override complexity -->
      <div class="">
        <div class="card-header border-0 p-2">
          <h5 class="card-title">Contact Completion</h5>
        </div>
        <div class="card-body p-2 small text-secondary">
          <ul class="list-unstyled mb-0">
            <li>Phone</li>
            <li>Email</li>
          </ul>
        </div>
      </div>
      <!-- Omitted 'card' class due to override complexity -->
      <div class="mb-4">
        <div class="card-header border-0 p-2">
          <h5 class="card-title">Referral</h5>
        </div>
        <div class="card-body p-2 small text-secondary">
          <ul class="list-unstyled mb-0">
            <li>Phone or Email</li>
            <li>Gender</li>
            <li>DOB</li>
            <li>Consent</li>
          </ul>
        </div>
      </div>
    {% endif %}
  </div>
  <div class="loading-spinner spinner-border text-primary" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>
