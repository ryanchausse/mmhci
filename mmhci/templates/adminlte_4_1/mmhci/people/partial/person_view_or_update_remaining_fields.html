{% load crispy_forms_tags %}
<div class="missing-fields-container">
  {% if pk %}
    <div class="card mb-4">
      <div class="card-header p-2">
        <h5 class="card-title">Referral</h5>
      </div>
      <div class="card-body p-2 small text-secondary">
        <ul class="list-unstyled mb-0">
          <li>Phone or Email</li>
          <li>Gender</li>
          <li>DOB</li>
          <li>Consent</li>
        </ul>
      </div>
    </div>
    <div class="card">
      <div class="card-header p-2">
        <h5 class="card-title">Contact Completion</h5>
      </div>
      <div class="card-body p-2 small text-secondary">
        <ul class="list-unstyled mb-0">
          <li>Phone</li>
          <li>Email</li>
        </ul>
      </div>
    </div>
  {% endif %}
</div>
<div class="loading-spinner spinner-border text-primary" role="status">
  <span class="sr-only">Loading...</span>
</div>
