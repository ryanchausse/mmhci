{% load crispy_forms_tags %}
{% if form.initial.id %}
  <form
    method="post"
    action="{% url 'core:people:view_or_update' pk=form.initial.id %}"
    hx-post="{% url 'core:people:view_or_update' pk=form.initial.id %}"
    autocomplete="off"
    hx-target="#person-view-or-update-form-container"
    hx-swap="innerHTML">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary mt-3">Save</button>
  </form>
{% else %}
  <h5>Go to /people/view/(id) to see data for a person</h5>
{% endif %}
