{% load static %}
<div class="org-context-container col-md-12 bg-body">
  <div class="border-bottom px-3 py-2">
    <div class="container-fluid">
      <div class="d-flex gap-4 align-items-center">
        <div class="d-flex gap-2 align-items-center">
          <div class="mt-1">
            <span><i class="nav-icon bi bi-building"></i></span>
          </div>
          <div>
            <select id="org-select-dropdown-button" class="form-select form-select-sm">
              <option selected>NWMPHN</option>
              <option>SEMPHN</option>
              <option>Western Victoria PHN</option>
            </select>
          </div>
        </div>
        <div>
          <span>
            <i class="nav-icon bi bi-person-square me-2"></i>
            {% if pk %}
              {{ form.first_name.value }} {{ form.last_name.value }} {{ form.dob.value|date:'d-m-Y' }}
            {% endif %}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
