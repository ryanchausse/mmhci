{% load static %}
<div id="org-context-bar" class="org-context-container col-md-12 bg-body" hx-swap-oob="innerHTML">
  <div class="border-bottom px-3 py-2">
    <div class="container-fluid">
      <div class="d-flex gap-4 align-items-center">
        <div class="d-flex gap-2 align-items-center">
          <div class="mt-1">
            <span><i class="nav-icon bi bi-building"></i></span>
          </div>
          <div>
            <form class="org-select-form" action="{% url 'core:core:change_current_org' %}" method="POST">
              {% csrf_token %}
              <input type="hidden" name="next" value="{{ request.get_full_path }}">
              <select class="org-select-dropdown" name="new_current_org_id" class="form-select form-select-sm">
                {% if request.org_perms %}
                  {% if not request.session.current_org_id %}
                    <option value="" selected>---</option>
                  {% endif %}
                  {% for org_id, org_data in request.org_perms.items %}
                    <option value="{{ org_id }}"{% if org_id == request.session.current_org_id %} selected{% endif %}>
                      {{ org_data.name }}
                    </option>
                  {% endfor %}
                {% else %}
                  <option selected>(No Org Permissions)</option>
                {% endif %}
              </select>
              <!-- In case user needs accessibility button -->
              <noscript>
                <button type="submit">Submit</button>
              </noscript>
            </form>
          </div>
        </div>
        <div>
          <span>
            <i class="nav-icon bi bi-person-square me-2"></i>
            {% if uuid %}
              {{ form.first_name.value }} {{ form.last_name.value }} {{ form.dob.value|date:'d-m-Y' }}
            {% endif %}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
