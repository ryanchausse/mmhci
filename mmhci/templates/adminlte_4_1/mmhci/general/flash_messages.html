{% block flash_messages %}
    <div id="flash-messages" class="messages" hx-swap-oob="innerHTML">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>
{% endblock flash_messages %}
