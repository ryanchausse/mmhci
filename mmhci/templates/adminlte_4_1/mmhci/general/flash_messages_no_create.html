{% block flash_messages %}
    <div id="flash-messages" class="messages" hx-swap-oob="innerHTML">
        {% if messages %}
            {% for message in messages %}
                {% if not "create_redirect" in message.tags %}
                    <div class="alert
                        {% if "debug" in message.tags %}alert-secondary
                        {% elif "info" in message.tags %}alert-info
                        {% elif "success" in message.tags %}alert-success
                        {% elif "warning" in message.tags %}alert-warning
                        {% elif "error" in message.tags %}alert-danger
                        {% endif %}">
                        {{ message }}
                    </div>
                {% endif %}
            {% endfor %}
        {% endif %}
    </div>
{% endblock flash_messages %}
